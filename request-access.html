<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Request access | DutyFree BD Marine Supply</title>
<link rel="icon" href="/logo-stacked.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#C2410C}
</style>
</head>
<body>
<div style="background:#0F172A;color:#FFFFFF;font:500 12px/1.4 Inter,system-ui,sans-serif;text-align:center;padding:7px 12px">Prototype preview · sample data · ordering is not open yet</div>
<div id="app"></div>
<template id="tpl">
<div style="font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #F4F6F9; min-height: 100vh">

<header style="border-bottom: 1px solid #D9E0E8; background: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="/" style="display: flex; align-items: center; text-decoration: none"><img src="/logo-header.png" alt="DutyFree BD Marine Supply" style="height: 44px; width: auto"></a>
<nav style="display: flex; flex-wrap: wrap; gap: 22px; align-items: center; font-size: 14px; font-weight: 500">
<a href="/" style="text-decoration: none">Home</a>
<a href="/products.html" style="text-decoration: none">Products</a>
<a href="/login.html" style="text-decoration: none; background: #0B2545; color: #FFFFFF; padding: 10px 16px; border-radius: 8px; font-weight: 600">Vessel Login</a>
</nav>
</div>
</header>

<div style="max-width: 1100px; margin: 0 auto; padding: 36px 24px 56px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E0E8; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600">Request access</h1>
<span style="font-size: 14px; color: #475569">Accounts are verified before ordering is enabled. Choose how you buy.</span>
</div>

<div style="display: flex; gap: 6px; background: #F4F6F9; border-radius: 10px; padding: 4px">
<button type="button" onclick="{{ pickCompany }}" style="flex: 1; min-height: 46px; border: 0; border-radius: 7px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{coBg}}; color: {{coFg}}">Company, owner or agent</button>
<button type="button" onclick="{{ pickCrew }}" style="flex: 1; min-height: 46px; border: 0; border-radius: 7px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{crBg}}; color: {{crFg}}">Crew member</button>
</div>

<template data-if="{{ isCompany }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Company name<input type="text" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Your role<select style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 10px; font-size: 15px; font-family: inherit; background: #FFFFFF"><option>Purchasing officer</option><option>Ship owner or manager</option><option>Local shipping agent</option><option>Master or chief officer</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Official email<input type="email" placeholder="name@company.com" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Phone or WhatsApp<input type="tel" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Vessel IMO number<input type="text" placeholder="7 digits" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Vessel name<input type="text" placeholder="Filled from IMO lookup" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit; background: #F4F6F9"></label>
</div>
<div style="border: 1px dashed #8FA3BF; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
<b style="font-size: 14px">Proof of authority</b>
<span style="font-size: 13px; color: #475569">Upload an authorisation letter, agency appointment or company ID. PDF or image.</span>
</div>
<span style="font-size: 13px; color: #475569">You can add more vessels and colleagues after approval.</span>
</template>

<template data-if="{{ isCrew }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Vessel IMO number<input type="text" placeholder="7 digits" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Vessel crew code<input type="text" placeholder="Given by the master or agent" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Full name as on crew list<input type="text" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Rank<input type="text" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">Email<input type="email" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #475569">WhatsApp<input type="tel" style="height: 44px; border: 1px solid #C3CDD9; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit"></label>
</div>
<span style="font-size: 13px; line-height: 1.5; color: #475569">Your name is matched to the crew list filed for this port call. Your spending limit comes from the vessel's verified Dollar Assessment.</span>
</template>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<a href="{{next}}" style="text-decoration: none; background: #C2410C; color: #FFFFFF; padding: 14px 22px; border-radius: 8px; font-weight: 600; font-size: 15px">Submit for verification</a>
<span style="font-size: 13px; color: #475569">Reviewed by the marine desk. You are notified by email.</span>
</div>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #0B2545; color: #FFFFFF; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<b style="font-family: 'Space Grotesk', sans-serif; font-size: 18px">What we verify</b>
<span style="font-size: 14px; line-height: 1.55; color: #D6DEEA">Company and official contact · Representative's authority · Vessel by IMO number · Sanctions screening of company and vessel</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #D9E0E8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 15px">Who can do what</b>
<span style="font-size: 14px; line-height: 1.55; color: #475569"><b style="color: #0F172A">Ship officers</b> raise requisitions.</span>
<span style="font-size: 14px; line-height: 1.55; color: #475569"><b style="color: #0F172A">Company representatives and agents</b> approve quotations and place purchase orders.</span>
<span style="font-size: 14px; line-height: 1.55; color: #475569"><b style="color: #0F172A">Crew</b> order personal items within their allowance.</span>
</div>
</aside>

</div>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
renderVals() {
const crew = !!(this.state && this.state.crew);
return {
isCompany: !crew, isCrew: crew,
coBg: crew ? 'transparent' : '#0B2545', coFg: crew ? '#0B2545' : '#FFFFFF',
crBg: crew ? '#0B2545' : 'transparent', crFg: crew ? '#FFFFFF' : '#0B2545',
next: crew ? '/login.html' : '/login.html',
pickCompany: () => this.setState({ crew: false }),
pickCrew: () => this.setState({ crew: true })
};
}
}
</script>
<script src="/app.js"></script>
</body>
</html>
